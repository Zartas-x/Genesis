name: Genesis Pro 3.1 Freedom
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        # Указываем путь к папке, если файлы создались внутри подпапки
        # Если файлы лежат в корне, оставь просто ./
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        continue-on-error: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.1-Final
          path: "**/build/outputs/apk/debug/*.apk"
