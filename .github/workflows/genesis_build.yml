name: Genesis Total Reset
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }

      - name: Build
        run: |
          # 1. Удаляем ВСЕ старое
          rm -rf app/build settings.gradle.kts build.gradle.kts gradle.properties
          
          # 2. Чистые конфиги
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Genesis"
          include(":app")
          EOF

          mkdir -p app
          cat <<EOF > app/build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2"
              id("org.jetbrains.kotlin.android") version "1.9.22"
          }
          android {
              namespace = "com.zartas.genesis"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.zartas.genesis"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 30
                  versionName = "3.0-STABLE"
                  buildConfigField("String", "API_KEY", "\"${{ secrets.GEMINI_API_KEY }}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              // ВАЖНО: используем версию 0.7.0, она была самой стабильной по эндпоинтам
              implementation("com.google.ai.client.generativeai:generativeai:0.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          mkdir -p app/src/main/java/com/zartas/genesis
          cat <<EOF > app/src/main/java/com/zartas/genesis/MainActivity.kt
          package com.zartas.genesis
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import com.google.ai.client.generativeai.GenerativeModel
          import kotlinx.coroutines.launch

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  // Используем просто "gemini-1.5-flash" без суффиксов
                  val model = GenerativeModel(modelName = "gemini-1.5-flash", apiKey = BuildConfig.API_KEY)
                  setContent {
                      val scope = rememberCoroutineScope()
                      var response by remember { mutableStateOf("Нажми кнопку...") }
                      
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Column(Modifier.fillMaxSize()) {
                              Text(response, modifier = Modifier.weight(1f))
                              Button(onClick = {
                                  response = "Думаю..."
                                  scope.launch {
                                      try {
                                          val res = model.generateContent("Привет!")
                                          response = res.text ?: "Пусто"
                                      } catch (e: Exception) {
                                          response = "ОШИБКА: \${e.localizedMessage}"
                                      }
                                  }
                              }) { Text("ТЕСТ API") }
                          }
                      }
                  }
              }
          }
          EOF
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.0
          path: "**/build/outputs/apk/debug/*.apk"
