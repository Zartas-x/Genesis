name: Genesis Gemini Design Fixed
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Force Clean Build
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -exec dirname {} \;)
          cd "$PROJECT_ROOT"
          
          # 1. Исправляем свойства проекта
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # 2. ПОЛНОСТЬЮ ПЕРЕЗАПИСЫВАЕМ КОНФИГ (Фикс Java 17)
          cat <<EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.zartas.genesis"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.zartas.genesis"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.2"
                  buildConfigField("String", "API_KEY", "\"${{ secrets.GEMINI_API_KEY }}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.ai.client.generativeai:generativeai:0.9.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
          }
          EOF

          # 3. MainActivity с дизайном Gemini (v1beta включен)
          cat <<EOF > app/src/main/java/com/zartas/genesis/MainActivity.kt
          package com.zartas.genesis
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.AutoAwesome
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.google.ai.client.generativeai.GenerativeModel
          import com.google.ai.client.generativeai.type.RequestOptions
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.launch

          data class Msg(val text: String, val isUser: Boolean)

          class ChatVM : ViewModel() {
              val history = MutableStateFlow<List<Msg>>(emptyList())
              var selectedModelName by mutableStateOf("gemini-3.1-pro-preview")
              fun send(p: String) {
                  if (p.isBlank()) return
                  val model = GenerativeModel(modelName = selectedModelName, apiKey = BuildConfig.API_KEY, requestOptions = RequestOptions(apiVersion = "v1beta"))
                  history.value += Msg(p, true)
                  val idx = history.value.size; history.value += Msg("...", false)
                  viewModelScope.launch {
                      var res = ""
                      try {
                          model.generateContentStream(p).collect { chunk ->
                              res += chunk.text ?: ""
                              val list = history.value.toMutableList()
                              list[idx] = Msg(res, false); history.value = list
                          }
                      } catch (e: Exception) {
                          val list = history.value.toMutableList()
                          list[idx] = Msg("Ошибка: \${e.message}", false); history.value = list
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(surface = Color(0xFF131314))) {
                          Surface(modifier = Modifier.fillMaxSize()) { ChatScreen() }
                      }
                  }
              }
          }

          @Composable
          fun ChatScreen(vm: ChatVM = viewModel()) {
              val msgs by vm.history.collectAsState()
              var input by remember { mutableStateOf("") }
              val state = rememberLazyListState()

              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      Icon(Icons.Default.AutoAwesome, contentDescription = null, tint = Color(0xFF4285F4))
                      Spacer(Modifier.width(8.dp))
                      Text("Genesis", fontWeight = FontWeight.SemiBold, fontSize = 20.sp)
                  }

                  LazyColumn(state = state, modifier = Modifier.weight(1f).padding(horizontal = 16.dp)) {
                      items(msgs) { m ->
                          Box(modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp), contentAlignment = if (m.isUser) Alignment.CenterEnd else Alignment.CenterStart) {
                              Surface(color = if (m.isUser) Color(0xFF2B2B2B) else Color.Transparent, shape = RoundedCornerShape(18.dp)) {
                                  Text(m.text, modifier = Modifier.padding(12.dp))
                              }
                          }
                      }
                  }

                  Box(modifier = Modifier.fillMaxWidth().padding(16.dp).imePadding()) {
                      TextField(
                          value = input,
                          onValueChange = { input = it },
                          modifier = Modifier.fillMaxWidth().clip(CircleShape),
                          placeholder = { Text("Запрос к Gemini 3.1...") },
                          colors = TextFieldDefaults.colors(focusedContainerColor = Color(0xFF1E1F20), unfocusedContainerColor = Color(0xFF1E1F20), focusedIndicatorColor = Color.Transparent, unfocusedIndicatorColor = Color.Transparent),
                          trailingIcon = {
                              IconButton(onClick = { if(input.isNotBlank()){ vm.send(input); input = "" } }) {
                                  Icon(Icons.Default.Send, contentDescription = null, tint = if(input.isBlank()) Color.Gray else Color(0xFFD1E3FF))
                              }
                          }
                      )
                  }
              }
          }
          EOF

          # 4. Сборка через 8.4
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-Gemini-Final
          path: "**/build/outputs/apk/debug/*.apk"
