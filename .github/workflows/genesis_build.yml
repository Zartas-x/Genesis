name: Genesis Pro 3.1 Freedom
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        # Мы заставляем скрипт искать файлы во всех подпапках
        run: |
          # Ищем, где на самом деле лежит gradlew
          GRADLEW_PATH=$(find . -name gradlew)
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          
          echo "Found gradlew in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.1-Final
          # Маска **/ найдет APK в любой подпапке билда
          path: "**/build/outputs/apk/debug/*.apk"
