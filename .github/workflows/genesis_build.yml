name: Genesis Pro 3.1 Evolution
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешаем запись файлов в репозиторий
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно для корректного пуша

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project Structure
        run: |
          # Создаем обертку Gradle
          gradle wrapper --gradle-version 8.2
          
          # Создаем папки
          mkdir -p app/src/main/java/com/zartas/genesis
          
          # Генерируем код (с фиксом v1beta для 3.1)
          cat <<EOF > app/src/main/java/com/zartas/genesis/MainActivity.kt
          package com.zartas.genesis
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.ui.Modifier
          import com.google.ai.client.generativeai.GenerativeModel
          import com.google.ai.client.generativeai.type.RequestOptions

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  // Модель 3.1 требует v1beta
                  val model = GenerativeModel(
                      modelName = "gemini-3.1-pro-preview",
                      apiKey = BuildConfig.API_KEY,
                      requestOptions = RequestOptions(apiVersion = "v1beta")
                  )
                  setContent { Text("Genesis 3.1 is Ready") }
              }
          }
          EOF

          # Генерируем билд-файлы
          cat <<EOF > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.zartas.genesis"; compileSdk = 34
              defaultConfig {
                  applicationId = "com.zartas.genesis"; minSdk = 24; targetSdk = 34
                  buildConfigField("String", "API_KEY", "\"${{ secrets.GEMINI_API_KEY }}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.ai.client.generativeai:generativeai:0.9.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          cat <<EOF > build.gradle.kts
          plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }
          EOF

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy Genesis 3.1 Source" || echo "No changes"
          git push origin HEAD:main

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.1-Release
          path: app/build/outputs/apk/debug/*.apk
