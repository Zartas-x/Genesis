name: Genesis Absolute Fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Clean and Rebuild
        run: |
          rm -rf app/build settings.gradle.kts build.gradle.kts gradle.properties
          
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat <<EOF > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Genesis"
          include(":app")
          EOF

          mkdir -p app
          cat <<EOF > app/build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2"
              id("org.jetbrains.kotlin.android") version "1.9.22"
          }
          android {
              namespace = "com.zartas.genesis"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.zartas.genesis"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 21
                  versionName = "1.5-FLASH-STABLE"
                  buildConfigField("String", "API_KEY", "\"${{ secrets.GEMINI_API_KEY }}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.ai.client.generativeai:generativeai:0.9.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
          }
          EOF

          mkdir -p app/src/main/java/com/zartas/genesis
          cat <<EOF > app/src/main/java/com/zartas/genesis/MainActivity.kt
          package com.zartas.genesis
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.google.ai.client.generativeai.GenerativeModel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.launch

          class ChatVM : ViewModel() {
              val history = MutableStateFlow<List<Pair<String, Boolean>>>(emptyList())
              // Самая стабильная модель для API на текущий момент
              private val model = GenerativeModel(
                  modelName = "gemini-1.5-flash", 
                  apiKey = BuildConfig.API_KEY
              )

              fun send(p: String) {
                  if (p.isBlank()) return
                  history.value += (p to true)
                  val idx = history.value.size
                  history.value += ("..." to false)
                  viewModelScope.launch {
                      try {
                          val response = model.generateContent(p)
                          val list = history.value.toMutableList()
                          list[idx] = (response.text ?: "Нет ответа") to false
                          history.value = list
                      } catch (e: Exception) {
                          val list = history.value.toMutableList()
                          list[idx] = ("Ошибка: \${e.localizedMessage}") to false
                          history.value = list
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(surface = Color(0xFF131314))) {
                          Surface(modifier = Modifier.fillMaxSize()) { ChatScreen() }
                      }
                  }
              }
          }

          @Composable
          fun ChatScreen(vm: ChatVM = viewModel()) {
              val msgs by vm.history.collectAsState()
              var input by remember { mutableStateOf("") }
              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      Icon(Icons.Default.Star, contentDescription = null, tint = Color(0xFF4285F4))
                      Spacer(Modifier.width(8.dp))
                      Text("Genesis Stable", style = MaterialTheme.typography.headlineSmall)
                  }
                  LazyColumn(modifier = Modifier.weight(1f).padding(horizontal = 16.dp)) {
                      items(msgs) { m ->
                          Box(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp), contentAlignment = if (m.second) Alignment.CenterEnd else Alignment.CenterStart) {
                              Surface(color = if (m.second) Color(0xFF2B2B2B) else Color(0xFF1E1F20), shape = RoundedCornerShape(12.dp)) {
                                  Text(m.first, modifier = Modifier.padding(10.dp), color = Color.White)
                              }
                          }
                      }
                  }
                  Row(modifier = Modifier.padding(16.dp).imePadding(), verticalAlignment = Alignment.CenterVertically) {
                      TextField(value = input, onValueChange = { input = it }, modifier = Modifier.weight(1f).clip(CircleShape), placeholder = { Text("Запрос...") })
                      IconButton(onClick = { if(input.isNotBlank()){ vm.send(input); input = "" } }) {
                          Icon(Icons.Default.Send, contentDescription = null, tint = Color(0xFFD1E3FF))
                      }
                  }
              }
          }
          EOF

          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-Stable-Build
          path: "**/build/outputs/apk/debug/*.apk"
