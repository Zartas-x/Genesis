name: Genesis Pro 3.1 Gemini Design
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Gemini Styled App
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -exec dirname {} \;)
          cd "$PROJECT_ROOT"
          
          # Настройки AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # Переписываем код с дизайном "под Gemini"
          cat <<EOF > app/src/main/java/com/zartas/genesis/MainActivity.kt
          package com.zartas.genesis
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.AutoAwesome
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.google.ai.client.generativeai.GenerativeModel
          import com.google.ai.client.generativeai.type.RequestOptions
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.launch

          data class Msg(val text: String, val isUser: Boolean)

          class ChatVM : ViewModel() {
              val history = MutableStateFlow<List<Msg>>(emptyList())
              var selectedModelName by mutableStateOf("gemini-3.1-pro-preview")
              fun send(p: String) {
                  if (p.isBlank()) return
                  val model = GenerativeModel(modelName = selectedModelName, apiKey = BuildConfig.API_KEY, requestOptions = RequestOptions(apiVersion = "v1beta"))
                  history.value += Msg(p, true)
                  val idx = history.value.size; history.value += Msg("...", false)
                  viewModelScope.launch {
                      var res = ""
                      try {
                          model.generateContentStream(p).collect { chunk ->
                              res += chunk.text ?: ""
                              val list = history.value.toMutableList()
                              list[idx] = Msg(res, false); history.value = list
                          }
                      } catch (e: Exception) {
                          val list = history.value.toMutableList()
                          list[idx] = Msg("Ошибка: \${e.message}", false); history.value = list
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(
                          surface = Color(0xFF131314),
                          onSurface = Color(0xFFE3E3E3),
                          primary = Color(0xFFD1E3FF)
                      )) {
                          Surface(modifier = Modifier.fillMaxSize()) { ChatScreen() }
                      }
                  }
              }
          }

          @Composable
          fun ChatScreen(vm: ChatVM = viewModel()) {
              val msgs by vm.history.collectAsState()
              var input by remember { mutableStateOf("") }
              val state = rememberLazyListState()

              Column(modifier = Modifier.fillMaxSize()) {
                  // Top Bar
                  Row(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      Icon(Icons.Default.AutoAwesome, contentDescription = null, tint = Color(0xFF4285F4), modifier = Modifier.size(24.dp))
                      Spacer(Modifier.width(8.dp))
                      Text("Genesis", fontWeight = FontWeight.SemiBold, fontSize = 20.sp)
                      Spacer(Modifier.weight(1f))
                      Text(vm.selectedModelName.replace("gemini-", "").uppercase(), color = Color.Gray, fontSize = 12.sp)
                  }

                  LazyColumn(state = state, modifier = Modifier.weight(1f).padding(horizontal = 16.dp)) {
                      items(msgs) { m ->
                          val bgColor = if (m.isUser) Color(0xFF2B2B2B) else Color.Transparent
                          Box(modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp), contentAlignment = if (m.isUser) Alignment.CenterEnd else Alignment.CenterStart) {
                              Surface(color = bgColor, shape = RoundedCornerShape(18.dp)) {
                                  Text(m.text, modifier = Modifier.padding(12.dp), lineHeight = 22.sp)
                              }
                          }
                      }
                  }

                  // Input Area
                  Box(modifier = Modifier.fillMaxWidth().padding(16.dp).imePadding()) {
                      TextField(
                          value = input,
                          onValueChange = { input = it },
                          modifier = Modifier.fillMaxWidth().clip(CircleShape),
                          placeholder = { Text("Введите запрос...", color = Color.Gray) },
                          colors = TextFieldDefaults.colors(
                              focusedContainerColor = Color(0xFF1E1F20),
                              unfocusedContainerColor = Color(0xFF1E1F20),
                              focusedIndicatorColor = Color.Transparent,
                              unfocusedIndicatorColor = Color.Transparent
                          ),
                          trailingIcon = {
                              IconButton(
                                  onClick = { if(input.isNotBlank()){ vm.send(input); input = "" } },
                                  modifier = Modifier.padding(end = 4.dp).background(if(input.isBlank()) Color.Transparent else Color(0xFFD1E3FF), CircleShape)
                              ) {
                                  Icon(Icons.Default.Send, contentDescription = null, tint = if(input.isBlank()) Color.Gray else Color.Black)
                              }
                          }
                      )
                  }
              }
          }
          EOF

          # Фикс Java
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts
          
          # Сборка
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-Gemini-Style
          path: "**/build/outputs/apk/debug/*.apk"
