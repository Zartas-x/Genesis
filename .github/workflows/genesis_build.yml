name: Genesis Pro 3.1 Freedom
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Regenerate and Build
        run: |
          # 1. Если gradlew нет, создаем его через системный gradle
          if [ ! -f "gradlew" ]; then
            echo "Gradlew not found, generating new one..."
            gradle wrapper --gradle-version 8.4
          fi

          # 2. Даем права и запускаем сборку
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.1-Freedom-APK
          path: "**/build/outputs/apk/debug/*.apk"
