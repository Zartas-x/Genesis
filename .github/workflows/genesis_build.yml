name: Genesis Pro 3.1 Freedom
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Flatten Structure and Build
        run: |
          # 1. Если файлы застряли в подпапке Genesis/Genesis, вытаскиваем их в корень
          # Ищем папку, где лежит app, и копируем всё оттуда сюда
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -exec dirname {} \;)
          echo "Project detected in: $PROJECT_ROOT"
          
          if [ "$PROJECT_ROOT" != "." ]; then
            cp -r $PROJECT_ROOT/. .
          fi

          # 2. Теперь gradlew точно в корне. Даем права и строим.
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.1-Final
          path: "**/build/outputs/apk/debug/*.apk"
