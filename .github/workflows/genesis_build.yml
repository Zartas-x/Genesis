name: Genesis Pro 3.1 Freedom
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK (Java Compatibility Fix)
        run: |
          # 1. Находим корень проекта
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -exec dirname {} \;)
          cd "$PROJECT_ROOT"
          
          # 2. Фикс AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # 3. ПРИНУДИТЕЛЬНЫЙ ФИКС СОВМЕСТИМОСТИ JAVA (Решение твоей ошибки)
          # Мы заменяем стандартные настройки на Java 17 для обоих компиляторов
          sed -i 's/jvmTarget = "17"/jvmTarget = "17"/' app/build.gradle.kts
          # Добавляем compileOptions, если они вдруг потерялись
          sed -i '/android {/a \    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' app/build.gradle.kts
          
          # 4. Сборка
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.1-Freedom
          path: "**/build/outputs/apk/debug/*.apk"
