name: Genesis Final Victory
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Radical Build Fix
        run: |
          # 1. Удаляем дубликаты конфигов в корне, если они мешают
          rm -f build.gradle.kts settings.gradle.kts
          
          # 2. Создаем чистый settings.gradle.kts
          echo 'rootProject.name = "Genesis"' > settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts

          # 3. Полная перезапись app/build.gradle.kts
          cat <<EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.zartas.genesis"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.zartas.genesis"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "1.5"
                  buildConfigField("String", "API_KEY", "\"${{ secrets.GEMINI_API_KEY }}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.ai.client.generativeai:generativeai:0.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
          }
          EOF

          # 4. MainActivity с гарантированно рабочей моделью
          cat <<EOF > app/src/main/java/com/zartas/genesis/MainActivity.kt
          package com.zartas.genesis
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Star
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.google.ai.client.generativeai.GenerativeModel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.launch

          class ChatVM : ViewModel() {
              val history = MutableStateFlow<List<Pair<String, Boolean>>>(emptyList())
              private val model = GenerativeModel(modelName = "gemini-1.5-flash-001", apiKey = BuildConfig.API_KEY)

              fun send(p: String) {
                  if (p.isBlank()) return
                  history.value += (p to true)
                  val idx = history.value.size
                  history.value += ("..." to false)
                  viewModelScope.launch {
                      try {
                          val response = model.generateContent(p)
                          val list = history.value.toMutableList()
                          list[idx] = (response.text ?: "Пустой ответ") to false
                          history.value = list
                      } catch (e: Exception) {
                          val list = history.value.toMutableList()
                          list[idx] = ("Ошибка: \${e.localizedMessage}") to false
                          history.value = list
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(surface = Color(0xFF131314))) {
                          Surface(modifier = Modifier.fillMaxSize()) { ChatScreen() }
                      }
                  }
              }
          }

          @Composable
          fun ChatScreen(vm: ChatVM = viewModel()) {
              val msgs by vm.history.collectAsState()
              var input by remember { mutableStateOf("") }
              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      Icon(Icons.Default.Star, contentDescription = null, tint = Color(0xFF4285F4))
                      Spacer(Modifier.width(8.dp))
                      Text("Genesis", style = MaterialTheme.typography.headlineSmall)
                  }
                  LazyColumn(modifier = Modifier.weight(1f).padding(horizontal = 16.dp)) {
                      items(msgs) { m ->
                          Box(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp), contentAlignment = if (m.second) Alignment.CenterEnd else Alignment.CenterStart) {
                              Surface(color = if (m.second) Color(0xFF2B2B2B) else Color.Transparent, shape = RoundedCornerShape(12.dp)) {
                                  Text(m.first, modifier = Modifier.padding(10.dp))
                              }
                          }
                      }
                  }
                  Row(modifier = Modifier.padding(16.dp).imePadding(), verticalAlignment = Alignment.CenterVertically) {
                      TextField(value = input, onValueChange = { input = it }, modifier = Modifier.weight(1f).clip(CircleShape), placeholder = { Text("Запрос...") })
                      IconButton(onClick = { if(input.isNotBlank()){ vm.send(input); input = "" } }) {
                          Icon(Icons.Default.Send, contentDescription = null, tint = Color(0xFFD1E3FF))
                      }
                  }
              }
          }
          EOF

          # 5. Сборка
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-Final-Victory
          path: "**/build/outputs/apk/debug/*.apk"
