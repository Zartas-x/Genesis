name: Genesis Pro 3.1 Freedom
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ПРИНУДИТЕЛЬНАЯ УСТАНОВКА GRADLE 8.4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK (Manual Fix)
        run: |
          # Находим корень проекта
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" -exec dirname {} \;)
          cd "$PROJECT_ROOT"
          
          # Генерируем новый wrapper версии 8.4 через установленный Gradle
          gradle wrapper --gradle-version 8.4
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.1-Final
          path: "**/build/outputs/apk/debug/*.apk"
