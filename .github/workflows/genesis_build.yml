name: Genesis Pro 3.1 Evolution
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project with Fixed Gradle Version
        run: |
          # 1. Создаем структуру папок
          mkdir -p app/src/main/java/com/zartas/genesis
          mkdir -p gradle/wrapper
          
          # 2. Явно прописываем Gradle 8.4 (версия 9.3.1 слишком новая для AGP 8.2)
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 3. Генерируем конфигурационные файлы
          cat <<EOF > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Genesis"; include(":app")
          EOF

          cat <<EOF > build.gradle.kts
          plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }
          EOF

          cat <<EOF > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.zartas.genesis"; compileSdk = 34
              defaultConfig {
                  applicationId = "com.zartas.genesis"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.1"
                  buildConfigField("String", "API_KEY", "\"${{ secrets.GEMINI_API_KEY }}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.ai.client.generativeai:generativeai:0.9.0")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui"); implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
          }
          EOF

          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Genesis" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:windowSoftInputMode="adjustResize" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Наш основной код с Gemini 3.1
          cat <<EOF > app/src/main/java/com/zartas/genesis/MainActivity.kt
          package com.zartas.genesis
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowDropDown
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.google.ai.client.generativeai.GenerativeModel
          import com.google.ai.client.generativeai.type.RequestOptions
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.launch

          data class Msg(val text: String, val isUser: Boolean)

          class ChatVM : ViewModel() {
              val history = MutableStateFlow<List<Msg>>(emptyList())
              var selectedModelName by mutableStateOf("gemini-3.1-pro-preview")
              fun send(p: String) {
                  if (p.isBlank()) return
                  val model = GenerativeModel(modelName = selectedModelName, apiKey = BuildConfig.API_KEY, requestOptions = RequestOptions(apiVersion = "v1beta"))
                  history.value += Msg(p, true); val idx = history.value.size; history.value += Msg("...", false)
                  viewModelScope.launch {
                      var res = ""
                      try {
                          model.generateContentStream(p).collect { chunk ->
                              res += chunk.text ?: ""; val list = history.value.toMutableList()
                              list[idx] = Msg(res, false); history.value = list
                          }
                      } catch (e: Exception) {
                          val list = history.value.toMutableList()
                          list[idx] = Msg("Error: \${e.message}", false); history.value = list
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContent { MaterialTheme(colorScheme = darkColorScheme()) { Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF131314)) { ChatScreen() } } }
              }
          }

          @Composable
          fun ChatScreen(vm: ChatVM = viewModel()) {
              val msgs by vm.history.collectAsState(); var input by remember { mutableStateOf("") }
              val state = rememberLazyListState(); var exp by remember { mutableStateOf(false) }
              val models = listOf("gemini-3.1-pro-preview", "gemini-3.1-flash-lite-preview", "gemini-3-flash-preview")

              Column(modifier = Modifier.fillMaxSize().imePadding()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(16.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                      Text("Genesis 3.1", style = MaterialTheme.typography.headlineMedium, color = Color.White)
                      Box {
                          Surface(color = Color(0xFF2B2B2B), shape = RoundedCornerShape(8.dp), modifier = Modifier.clickable { exp = true }) {
                              Row(modifier = Modifier.padding(8.dp)) {
                                  Text(vm.selectedModelName.replace("gemini-", "").uppercase(), color = Color.Cyan)
                                  Icon(Icons.Default.ArrowDropDown, contentDescription = null, tint = Color.Cyan)
                              }
                          }
                          DropdownMenu(expanded = exp, onDismissRequest = { exp = false }) {
                              models.forEach { m -> DropdownMenuItem(text = { Text(m) }, onClick = { vm.selectedModelName = m; exp = false }) }
                          }
                      }
                  }
                  LazyColumn(state = state, modifier = Modifier.weight(1f).padding(8.dp)) {
                      items(msgs) { m ->
                          val align = if (m.isUser) Alignment.End else Alignment.Start
                          Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = align) {
                              Surface(color = if (m.isUser) Color(0xFF303030) else Color(0xFF1E1E1E), shape = RoundedCornerShape(12.dp), modifier = Modifier.padding(4.dp)) {
                                  Text(m.text, modifier = Modifier.padding(10.dp), color = Color.White)
                              }
                          }
                      }
                  }
                  Row(modifier = Modifier.padding(16.dp)) {
                      TextField(value = input, onValueChange = { input = it }, modifier = Modifier.weight(1f), shape = RoundedCornerShape(20.dp))
                      FloatingActionButton(onClick = { if(input.isNotBlank()){ vm.send(input); input = "" } }, containerColor = Color(0xFFD1E3FF)) {
                          Icon(Icons.Default.Send, contentDescription = null, tint = Color.Black)
                      }
                  }
              }
          }
          EOF

          # 4. Создаем сам исполняемый файл gradlew через системный gradle
          gradle wrapper

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Genesis 3.1: Force Gradle 8.4 downgrade for compatibility" || echo "No changes"
          git push origin HEAD:main

      - name: Build APK with Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-3.1-Stable
          path: app/build/outputs/apk/debug/*.apk
