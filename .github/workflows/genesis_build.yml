name: Genesis Pro Auto-Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ШАГ 1: Обманываем систему пустой настройкой
      - name: Trick Gradle 9.3.1
        run: |
          touch settings.gradle.kts
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      # ШАГ 2: Создаем все файлы, включая gradle.properties для AndroidX
      - name: Auto-Create Genesis Project
        run: |
          mkdir -p app/src/main/java/com/zartas/genesis
          
          # Разрешаем использование современных библиотек AndroidX
          cat <<EOF > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Genesis" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:windowSoftInputMode="adjustResize" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<EOF > app/src/main/java/com/zartas/genesis/MainActivity.kt
          package com.zartas.genesis
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.google.ai.client.generativeai.GenerativeModel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.launch

          data class Msg(val text: String, val isUser: Boolean)

          class ChatVM : ViewModel() {
              val history = MutableStateFlow<List<Msg>>(emptyList())
              private val model = GenerativeModel(modelName = "gemini-1.5-pro", apiKey = BuildConfig.API_KEY)

              fun send(p: String) {
                  if (p.isBlank()) return
                  history.value += Msg(p, true)
                  val aiMsgIndex = history.value.size
                  history.value += Msg("...", false)

                  viewModelScope.launch {
                      var fullResp = ""
                      try {
                          model.generateContentStream(p).collect { chunk ->
                              fullResp += chunk.text ?: ""
                              val updated = history.value.toMutableList()
                              updated[aiMsgIndex] = Msg(fullResp, false)
                              history.value = updated
                          }
                      } catch (e: Exception) {
                          val updated = history.value.toMutableList()
                          updated[aiMsgIndex] = Msg("Ошибка: \${e.message}", false)
                          history.value = updated
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF131314)) {
                              ChatScreen()
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChatScreen(vm: ChatVM = viewModel()) {
              val messages by vm.history.collectAsState()
              var input by remember { mutableStateOf("") }
              val listState = rememberLazyListState()

              LaunchedEffect(messages.size) { 
                  if(messages.isNotEmpty()) listState.animateScrollToItem(messages.size - 1) 
              }

              Column(modifier = Modifier.fillMaxSize().imePadding()) {
                  Box(modifier = Modifier.fillMaxWidth().padding(16.dp)) {
                      Text("Genesis Pro", style = MaterialTheme.typography.headlineMedium, color = Color.White)
                  }
                  
                  LazyColumn(state = listState, modifier = Modifier.weight(1f).padding(horizontal = 8.dp)) {
                      items(messages) { m ->
                          val align = if (m.isUser) Alignment.End else Alignment.Start
                          val color = if (m.isUser) Color(0xFF303030) else Color(0xFF1E1E1E)
                          Column(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp), horizontalAlignment = align) {
                              Surface(color = color, shape = RoundedCornerShape(16.dp)) {
                                  Text(m.text, modifier = Modifier.padding(12.dp), color = Color.White)
                              }
                          }
                      }
                  }

                  Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      TextField(
                          value = input, 
                          onValueChange = { input = it },
                          modifier = Modifier.weight(1f),
                          placeholder = { Text("Спроси Genesis...") },
                          shape = RoundedCornerShape(24.dp),
                          colors = TextFieldDefaults.colors(focusedIndicatorColor = Color.Transparent, unfocusedIndicatorColor = Color.Transparent)
                      )
                      Spacer(modifier = Modifier.width(8.dp))
                      FloatingActionButton(onClick = { if(input.isNotBlank()){ vm.send(input); input = "" } }, containerColor = Color(0xFFD1E3FF)) {
                          Icon(Icons.Default.Send, contentDescription = null, tint = Color.Black)
                      }
                  }
              }
          }
          EOF

          cat <<EOF > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Genesis"; include(":app")
          EOF

          cat <<EOF > build.gradle.kts
          plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }
          EOF

          cat <<EOF > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.zartas.genesis"; compileSdk = 34
              defaultConfig {
                  applicationId = "com.zartas.genesis"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0"
                  buildConfigField("String", "API_KEY", "\"${{ secrets.GEMINI_API_KEY }}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui"); implementation("androidx.compose.material3:material3")
              implementation("com.google.ai.client.generativeai:generativeai:0.2.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
          }
          EOF

      # ШАГ 3: Запускаем сборку
      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
